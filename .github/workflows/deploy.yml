name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    name: CDK Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Install Python dependencies
        run: pip install -e .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Bootstrap CDK (safe to run every time)
        run: cdk bootstrap --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Synthesize CDK app
        run: cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy
        run: cdk deploy --require-approval never --outputs-file cdk-outputs.json
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Post CloudFront URL to summary
        if: success()
        run: |
          WEBSITE_URL=$(python3 -c "
          import json, sys
          with open('cdk-outputs.json') as f:
              outputs = json.load(f)
          # Find WebsiteUrl in any stack
          for stack in outputs.values():
              for key, value in stack.items():
                  if 'WebsiteUrl' in key:
                      print(value)
                      sys.exit(0)
          print('URL not found in outputs')
          ")
          echo "## Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your website is live at: **${WEBSITE_URL}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "It may take 1-2 minutes for CloudFront to fully propagate." >> $GITHUB_STEP_SUMMARY

      - name: Show deployment error details
        if: failure()
        run: |
          echo "## Deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copy the error below and paste it into Claude Code with:" >> $GITHUB_STEP_SUMMARY
          echo '**"Help me fix this deployment error"**' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CloudFormation failure events" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          aws cloudformation describe-stack-events \
            --stack-name WebsiteStack \
            --query 'StackEvents[?contains(`["ROLLBACK_IN_PROGRESS","UPDATE_ROLLBACK_IN_PROGRESS","CREATE_FAILED","UPDATE_FAILED","DELETE_FAILED"]`, ResourceStatus)].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output table 2>/dev/null || echo "Could not retrieve stack events"
          echo '```' >> $GITHUB_STEP_SUMMARY
